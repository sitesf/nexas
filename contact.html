<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#000000"/>
<title>Contact — NEXAS</title>
<meta name="description" content="Contactează NEXAS. Răspundem în câteva ore."/>

<!-- Font Syne — local, fără Google, GDPR curat -->
<style>
@font-face {
  font-family: 'Syne';
  src: url('fonts/syne-latin-400-normal.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Syne';
  src: url('fonts/syne-latin-700-normal.woff2') format('woff2');
  font-weight: 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Syne';
  src: url('fonts/syne-latin-800-normal.woff2') format('woff2');
  font-weight: 800; font-style: normal; font-display: swap;
}
</style>

<style>
/* ══════════════════════════════════════
   NEXAS — contact.html
   3D room 2 panouri + formular integrat
   ══════════════════════════════════════ */
:root {
  --sans:   'Syne', system-ui, sans-serif;
  --blue:   #5aaeff;
  --text:   #ffffff;
  --dim:    rgba(255,255,255,0.58);
  --mute:   rgba(255,255,255,0.28);
  --border: rgba(255,255,255,0.09);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--sans);
  background: #000308;
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Canvas Three.js ── */
#canvas {
  position: fixed; top:0; left:0;
  width:100%; height:100dvh;
  display:block; z-index:0;
}

/* ══════════════
   NAV
   ══════════════ */
nav {
  position: fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 36px;
}
.nav-brand {
  font-size:14px; font-weight:700; letter-spacing:.04em;
  color:var(--text); text-decoration:none;
}
.nav-brand .slash { color:var(--mute); margin:0 5px; }
.nav-brand .sub   { color:var(--mute); font-weight:400; }
.nav-back {
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--mute); text-decoration:none;
  transition: color .2s;
}
.nav-back:hover { color:#fff; }

/* ══════════════════════════════════════
   FORMULAR — plutitor în centrul scenei
   ══════════════════════════════════════ */
#form-layer {
  position: fixed; inset:0; z-index:20;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}

.form-card {
  pointer-events: auto;
  width: min(460px, calc(100% - 40px));
  background: rgba(3, 5, 16, 0.75);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 20px;
  padding: 34px 36px 30px;
  backdrop-filter: blur(30px) saturate(150%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 40px 90px rgba(0,0,0,0.7),
    0 0 80px rgba(90,174,255,0.07);
}

.form-tag {
  display:inline-flex; align-items:center; gap:7px;
  font-size:10px; letter-spacing:.26em; text-transform:uppercase;
  color:var(--blue); border:1px solid rgba(90,174,255,.18);
  padding:4px 12px; border-radius:100px;
  margin-bottom:14px; font-family:monospace;
}
.tag-dot {
  width:5px; height:5px; border-radius:50%;
  background:var(--blue); animation:ep 2s ease infinite;
}
@keyframes ep { 0%,100%{opacity:1} 50%{opacity:.3} }

.form-card h1 {
  font-size:clamp(20px,2.8vw,28px);
  font-weight:800; letter-spacing:-.03em;
  line-height:1.05; margin-bottom:5px;
}
.form-card .sub-head {
  font-size:12.5px; color:var(--dim);
  margin-bottom:22px; line-height:1.5;
}

/* Câmpuri */
.fields { display:flex; flex-direction:column; gap:10px; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label {
  font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--mute); font-family:monospace;
}
.field input,
.field textarea {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius:9px; padding:11px 13px;
  font-family:var(--sans); font-size:13px;
  color:var(--text); outline:none; resize:none; width:100%;
  transition: border-color .2s, background .2s;
}
.field input::placeholder,
.field textarea::placeholder { color:rgba(255,255,255,0.2); }
.field input:focus,
.field textarea:focus {
  border-color:rgba(90,174,255,.36);
  background:rgba(90,174,255,.04);
}

/* GDPR */
.gdpr-row {
  display:flex; align-items:flex-start; gap:10px; margin-top:2px;
}
.gdpr-row input[type="checkbox"] {
  width:14px; height:14px; flex-shrink:0;
  margin-top:2px; accent-color:var(--blue); cursor:pointer;
}
.gdpr-row label {
  font-size:11px; color:var(--mute); line-height:1.6; cursor:pointer;
}
.gdpr-row a { color:rgba(90,174,255,.65); text-decoration:underline; }

/* Submit */
.submit-btn {
  width:100%; padding:13px;
  background:#fff; color:#000;
  border:none; border-radius:10px;
  font-family:var(--sans); font-size:13px; font-weight:800;
  letter-spacing:.05em; text-transform:uppercase;
  cursor:pointer; margin-top:2px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition: opacity .2s, transform .15s;
}
.submit-btn:hover { opacity:.88; transform:translateY(-1px); }
.submit-btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }

/* Status */
#status {
  margin-top:10px; padding:11px 14px;
  border-radius:9px; font-size:12px;
  display:none; line-height:1.5;
}
#status.ok  { background:rgba(37,211,102,.1);  border:1px solid rgba(37,211,102,.22); color:#25D366; }
#status.err { background:rgba(255,80,80,.1);   border:1px solid rgba(255,80,80,.22);  color:#ff5a5a; }

/* Contact direct */
.direct-links {
  display:flex; justify-content:center; gap:20px; margin-top:16px;
}
.direct-link {
  display:flex; align-items:center; gap:6px;
  font-size:12px; color:var(--mute);
  text-decoration:none; transition:color .2s;
}
.direct-link:hover { color:#fff; }

/* Mobile */
@media(max-width:600px) {
  nav { padding:16px 20px; }
  .form-card { padding:26px 20px 22px; }
  .field-row { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-brand">
    NEXAS <span class="slash">/</span><span class="sub">agenție</span>
  </a>
  <a href="index.html" class="nav-back">← Înapoi</a>
</nav>

<!-- CANVAS 3D -->
<canvas id="canvas"></canvas>

<!-- FORMULAR -->
<div id="form-layer">
  <div class="form-card">
    <div class="form-tag"><span class="tag-dot"></span>Hai să vorbim</div>
    <h1>Ai un proiect în minte?</h1>
    <p class="sub-head">Răspundem în câteva ore — discuția inițială e gratuită.</p>

    <form id="contactForm">
      <div class="fields">
        <div class="field-row">
          <div class="field">
            <label for="from_name">Nume *</label>
            <input type="text" id="from_name" name="from_name" placeholder="Numele tău" required/>
          </div>
          <div class="field">
            <label for="from_email">Email *</label>
            <input type="email" id="from_email" name="from_email" placeholder="email@tu.ro" required/>
          </div>
        </div>

        <div class="field">
          <label for="phone">Telefon</label>
          <input type="tel" id="phone" name="phone" placeholder="+40 7xx xxx xxx"/>
        </div>

        <div class="field">
          <label for="message">Mesaj *</label>
          <textarea id="message" name="message" rows="3"
                    placeholder="Descrie pe scurt proiectul tău..." required></textarea>
        </div>

        <!-- GDPR — Art. 7 GDPR, obligatoriu -->
        <div class="gdpr-row">
          <input type="checkbox" id="gdpr" required/>
          <label for="gdpr">
            Accept prelucrarea datelor de către NEXAS conform
            <a href="privacy.html" target="_blank">Politicii de confidențialitate</a>. *
          </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Trimite mesajul →
        </button>
        <div id="status"></div>
      </div>
    </form>

    <div class="direct-links">
      <!-- ► Schimbă numărul cu al tău -->
      <a href="https://wa.me/40764639118" target="_blank" class="direct-link">💬 WhatsApp</a>
      <a href="tel:+40764639118" class="direct-link">📞 Telefon</a>
      <a href="mailto:contact@nexas.ro" class="direct-link">✉️ Email</a>
    </div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   SCENĂ 3D — contact.html
   2 panouri + spoturi realiste cu fascicole vizibile
   ══════════════════════════════════════════════════════════ */

const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000308);
scene.fog        = new THREE.FogExp2(0x000308, 0.030);

const camera = new THREE.PerspectiveCamera(
  62, window.innerWidth/window.innerHeight, 0.1, 80
);
camera.position.set(0, 0.6, 9.5);
camera.lookAt(0, 0.2, 0);

/* ── PODEA ── */
scene.add(Object.assign(
  new THREE.Mesh(
    new THREE.PlaneGeometry(30, 24),
    new THREE.MeshStandardMaterial({ color:0x050810, roughness:0.70, metalness:0.28 })
  ),
  { rotation: { x: -Math.PI/2, y:0, z:0 }, position: { x:0, y:-3.0, z:0 } }
));
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(30,24),
  new THREE.MeshStandardMaterial({ color:0x050810, roughness:0.70, metalness:0.28 })
);
floorMesh.rotation.x = -Math.PI/2;
floorMesh.position.y = -3.0;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

/* ── TAVAN ── */
const ceilMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(28, 22),
  new THREE.MeshStandardMaterial({ color:0x040608, roughness:0.95 })
);
ceilMesh.rotation.x = Math.PI/2;
ceilMesh.position.y = 5.8;
scene.add(ceilMesh);

/* ── PEREȚI ── */
const wMat = new THREE.MeshStandardMaterial({ color:0x030405, roughness:0.98 });
[[−10,1,−3, Math.PI/2], [10,1,−3,−Math.PI/2], [0,1,−10,0]].forEach(([x,y,z,ry]) => {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(24,12), wMat);
  w.position.set(x,y,z); w.rotation.y = ry; scene.add(w);
});

/* ── CANVAS GRADIENT PANOURI (animat) ── */
const SCR_W=512, SCR_H=1024;
const scrCv=document.createElement('canvas');
scrCv.width=SCR_W; scrCv.height=SCR_H;
const scrCtx=scrCv.getContext('2d');
const scrTex=new THREE.CanvasTexture(scrCv);

function paintPanel(t) {
  const s = Math.sin(t*0.28)*0.15;
  const g = scrCtx.createLinearGradient(0,0,SCR_W*0.85,SCR_H);
  g.addColorStop(0,   `hsl(${226+s*28},68%,28%)`);
  g.addColorStop(0.38,`hsl(${241+s*18},78%,48%)`);
  g.addColorStop(0.72,`hsl(${222+s*22},64%,36%)`);
  g.addColorStop(1,   `hsl(${234+s*14},70%,26%)`);
  scrCtx.fillStyle=g; scrCtx.fillRect(0,0,SCR_W,SCR_H);
  const hl=scrCtx.createRadialGradient(SCR_W*.5,SCR_H*.28,0,SCR_W*.5,SCR_H*.28,SCR_W*.72);
  hl.addColorStop(0,'rgba(255,255,255,0.15)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  scrCtx.fillStyle=hl; scrCtx.fillRect(0,0,SCR_W,SCR_H);
  scrTex.needsUpdate=true;
}
paintPanel(0);

const panelMat = new THREE.MeshBasicMaterial({ map:scrTex });
const frameMat = new THREE.MeshBasicMaterial({ color:0x020202 });
const PANEL_W=4.8, PANEL_H=9.5;
const panelGeo = new THREE.PlaneGeometry(PANEL_W, PANEL_H);
const frameGeo = new THREE.PlaneGeometry(PANEL_W+0.15, PANEL_H+0.15);

/* Panou STÂNGA */
[frameMat, panelMat].forEach((mat,i) => {
  const m = new THREE.Mesh(i===0?frameGeo:panelGeo, mat);
  m.position.set(-3.2, 0.5, i===0?-5.52:-5.50);
  m.rotation.y = 0.09;
  scene.add(m);
});
/* Panou DREAPTA */
[frameMat, panelMat].forEach((mat,i) => {
  const m = new THREE.Mesh(i===0?frameGeo:panelGeo, mat);
  m.position.set(3.2, 0.5, i===0?-5.52:-5.50);
  m.rotation.y = -0.09;
  scene.add(m);
});

/* ══════════════════════════════════════════════════════════
   SPOTURI REALISTE
   Fiecare spot = SpotLight + sferuță bec + con de lumină vizibil
   ══════════════════════════════════════════════════════════ */
function makeSpot(px,py,pz, tx,ty,tz, col, intensity, angle) {
  angle = angle || 0.26;

  /* SpotLight */
  const sl = new THREE.SpotLight(col, intensity);
  sl.position.set(px,py,pz);
  sl.angle    = angle;
  sl.penumbra = 0.40;
  sl.decay    = 1.7;
  sl.distance = 20;
  sl.castShadow = true;
  sl.shadow.mapSize.width = sl.shadow.mapSize.height = 1024;
  sl.shadow.bias = -0.001;
  sl.target.position.set(tx,ty,tz);
  scene.add(sl); scene.add(sl.target);

  /* Bec vizual */
  scene.add(Object.assign(
    new THREE.Mesh(
      new THREE.SphereGeometry(0.052,8,8),
      new THREE.MeshBasicMaterial({ color:col })
    ),
    { position: new THREE.Vector3(px,py,pz) }
  ));

  /* Con de lumină vizibil (volum) */
  const cH = 7.5;
  const cR = Math.tan(angle) * cH;
  const coneMesh = new THREE.Mesh(
    new THREE.ConeGeometry(cR, cH, 18, 1, true),
    new THREE.MeshBasicMaterial({
      color: col, transparent:true, opacity:0.024,
      side:THREE.BackSide, depthWrite:false
    })
  );
  /* Orientare con: vârful sus (la bec), baza jos */
  coneMesh.position.set(px, py - cH/2, pz);
  scene.add(coneMesh);

  return sl;
}

/* ── Spoturi principale albe-calde ── */
makeSpot(-3.6, 5.6, -0.8,  -3.2,  0.5, -5.5,  0xfff5e0, 3.8);   /* panou stânga */
makeSpot( 3.6, 5.6, -0.8,   3.2,  0.5, -5.5,  0xfff5e0, 3.8);   /* panou dreapta */
makeSpot( 0.0, 5.6,  1.0,   0.0, -2.0,  0.0,  0xfff8f0, 3.0);   /* centru față */
makeSpot(-1.8, 5.6, -2.5,  -1.5, -1.0, -4.0,  0xfff5e0, 2.0);   /* stânga spate */
makeSpot( 1.8, 5.6, -2.5,   1.5, -1.0, -4.0,  0xfff5e0, 2.0);   /* dreapta spate */

/* ── Accente albastre pe panouri ── */
makeSpot(-3.0, 5.4, -3.8,  -3.2, 0.5, -5.5,   0x5aaaff, 2.0, 0.20);
makeSpot( 3.0, 5.4, -3.8,   3.2, 0.5, -5.5,   0x5aaaff, 2.0, 0.20);

/* ── Fill lateral dim ── */
makeSpot(-7.0, 3.5,  0.5,  0.0, 0.0, 0.0,     0xfff0e0, 0.5, 0.35);
makeSpot( 7.0, 3.5,  0.5,  0.0, 0.0, 0.0,     0xfff0e0, 0.5, 0.35);

/* ── Lumina ambiantă + fill ── */
scene.add(new THREE.AmbientLight(0x0a1020, 2.0));
const fill = new THREE.DirectionalLight(0x8090cc, 0.30);
fill.position.set(0,3,8); scene.add(fill);

/* ══════════════════════════════════════════════════════════
   ANIMAȚIE
   ══════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let camXSmooth = 0;
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  frameCount++;

  /* Repictare gradient la ~10fps (fiecare 3 frames la 30fps) */
  if (frameCount % 3 === 0) paintPanel(t);

  /* Mișcare subtilă cameră — respirație */
  const tCamX = Math.sin(t * 0.16) * 0.12;
  camXSmooth += (tCamX - camXSmooth) * 0.025;
  camera.position.x = camXSmooth;
  camera.position.y = 0.6 + Math.sin(t * 0.20) * 0.035;
  camera.lookAt(0, 0.2, 0);

  renderer.render(scene, camera);
}
animate();

/* RESIZE */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   EMAILJS
   Public Key  : G-hhNeSiDqE6XRBLp
   Service ID  : service_r6h7o5j
   Template ID : template_zmwlkw5

   Variabile în template EmailJS:
   {{from_name}} {{from_email}} {{phone}} {{message}}
   ══════════════════════════════════════════════════════════ */
emailjs.init('G-hhNeSiDqE6XRBLp');

const form      = document.getElementById('contactForm');
const submitBtn = document.getElementById('submitBtn');
const statusEl  = document.getElementById('status');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  if (!document.getElementById('gdpr').checked) {
    show('Te rugăm să accepți politica de confidențialitate.', 'err');
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'Se trimite...';

  emailjs.send('service_r6h7o5j', 'template_zmwlkw5', {
    from_name:  document.getElementById('from_name').value.trim(),
    from_email: document.getElementById('from_email').value.trim(),
    phone:      document.getElementById('phone').value.trim() || '—',
    message:    document.getElementById('message').value.trim(),
    reply_to:   document.getElementById('from_email').value.trim(),
  })
  .then(() => { show('✓ Mesaj trimis! Îți răspundem în câteva ore.', 'ok'); form.reset(); })
  .catch(err => { console.error(err); show('Eroare. Încearcă WhatsApp sau email direct.', 'err'); })
  .finally(() => { submitBtn.disabled=false; submitBtn.textContent='Trimite mesajul →'; });
});

function show(msg, type) {
  statusEl.textContent = msg;
  statusEl.className   = type;
  statusEl.style.display = 'block';
  setTimeout(() => { statusEl.style.display='none'; }, 6000);
}
</script>
</body>
</html>
