<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexas — Demo Agent AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #f5f3ff;
      overflow: hidden;
    }
    .bg-glow {
      position: fixed;
      top: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(109,40,217,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .center {
      text-align: center;
      z-index: 1;
    }
    .label {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #6d28d9;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    h1 span { color: #8b5cf6; }
    p { font-size: 16px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="center">
    <div class="label">Nexas Digital</div>
    <h1>Agent AI <span>Live</span></h1>
    <p>Click pe iconița violet din dreapta jos pentru a testa</p>
  </div>

  <!-- EMBED NEXAS AGENT — o singura linie -->
  <script src="nexas-agent.js"></script>
</body>
</html>
