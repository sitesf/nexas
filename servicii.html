<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXAS Servicii</title>
<style>
body{
background:#0A0A0F;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.card{
background:#12121b;
border:1px solid rgba(108,99,255,.22);
border-radius:24px;
padding:40px;
width:380px;
}
.badge{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:rgba(108,99,255,.12);
border:1px solid rgba(108,99,255,.18);
margin-bottom:20px;
}
h2{
margin:0;
font-size:18px;
opacity:.8;
}
.price{
font-size:68px;
font-weight:bold;
margin:20px 0;
}
p{
opacity:.8;
line-height:1.6;
}
.btn{
display:block;
margin-top:24px;
background:#6C63FF;
padding:16px;
border-radius:14px;
text-align:center;
text-decoration:none;
color:white;
font-weight:bold;
}
</style>
</head>
<body>

<div class="card">
<div class="badge">Cel Mai Popular</div>

<h2>BUSINESS</h2>

<div class="price">500 RON</div>

<p>
Solutia completa pentru afaceri care vor rezultate reale online.
</p>

<a href="#" class="btn">Incepe acum</a>
</div>

</body>
</html>
