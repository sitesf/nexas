name: Actualizare stiri NEXAS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser google-genai

      - name: Generate news JSON
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_stiri.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stiri/stiri.json || true
          git commit -m "stiri: actualizare automata $(date -u '+%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
